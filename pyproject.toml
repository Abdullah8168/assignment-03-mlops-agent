[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-agent"
version = "1.0.0"
description = "Production-ready MLOps AI agent integrating DVC, MLflow, Airflow and Kubernetes"
readme = "README.md"
requires-python = ">=3.11"
# Core dependencies: enough to run the agent, its API and the test suite.
dependencies = [
    "anthropic>=0.75",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Heavy MLOps clients - needed to talk to real services and to train models.
# CI does not install these: every external call is mocked in tests.
mlops = [
    "mlflow>=3.1,<4",
    "scikit-learn>=1.4",
    "pandas>=2.1",
    "joblib>=1.3",
    "dvc>=3.50",
    "kubernetes>=30.1",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["agent*", "api*", "training*", "serving*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", ".dvc", "mlruns", "airflow"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]
