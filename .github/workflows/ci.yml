name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      # All external systems (MLflow, Airflow, Kubernetes, Claude) are mocked in the test suite.
      AGENT_LLM_BACKEND: offline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (core + dev only, no heavy MLOps clients)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -v

  training-smoke:
    # Trains the model end-to-end on a generated dataset, without MLflow, to catch pipeline regressions.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]" scikit-learn pandas joblib numpy
      - run: python scripts/make_dataset.py --version v2
      - run: python -m training.train --no-mlflow --out artifacts/ci
      - run: pytest tests/test_training.py -v
