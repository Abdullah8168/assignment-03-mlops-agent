apiVersion: v1
kind: ConfigMap
metadata:
  name: prediction-api-config
  namespace: ml-serving
  labels:
    app: prediction-api
data:
  # Non-sensitive configuration only. Secrets never go in a ConfigMap.
  APP_VERSION: "1.0.0"
  MODEL_NAME: "breast-cancer-classifier"
  MODEL_PATH: "/app/model/model.joblib"
  PREDICTION_THRESHOLD: "0.5"
  LOG_LEVEL: "INFO"
